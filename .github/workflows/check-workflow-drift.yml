# Fails when an immediately-run app repo's `cache.yml` is not the stub that calls
# this template's shared job (`zip-cache.yml@main`, R3-1332).
#
# WHY. `cache.yml` is owned here, but until R3-1332 every repo got its copy BY VALUE at
# creation and nothing updated it afterwards. By 2026-09-04 that had produced 22
# repos whose copy predated the Pages token-mint step — none of them able to
# self-provision Pages — and `bundle-picker`, which drifted three days after it
# was created because its workflow was copied from a sibling repo rather than
# from here, and served a 404 for its cache until someone looked (R3-535).
#
# Since R3-1332 the job lives once, in `.github/workflows/zip-cache.yml`, and each
# repo carries only the stub `scripts/zip-cache-stub.mjs` renders, so a fix here
# reaches every repo on its next run. The check accepts a stub whose comments are
# reworded, its own push branches and its own landing page; anything else is drift.

name: Check workflow drift

on:
  schedule:
    - cron: '30 5 * * *'
  # Also on any change to the workflow itself: the moment this file moves, every
  # other repo is by definition behind, and that should be visible immediately
  # rather than at the next nightly.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache.yml'
      - '.github/workflows/zip-cache.yml'
      - 'scripts/zip-cache-stub.mjs'
      - 'scripts/zip-cache-stub.test.mjs'
      - 'scripts/check-workflow-drift.mjs'
      - 'scripts/check-kept-zip-refs.mjs'
      - '.github/workflows/check-workflow-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Guards the comparison itself: proves a removed step and a changed pin
      # are both detected, so a green run cannot mean "the check stopped
      # looking".
      - name: Self-test the comparison
        run: node scripts/check-workflow-drift.mjs --self-test

      # The pin has to be servable: a zip-cache.yml pinning a version npm does
      # not have turns a working zip into no zip at all, in every repo calling it. This template's own cache run
      # was red for four days for exactly that reason (R3-623), and the only
      # thing that surfaced it was a failed zip run in one repo.
      - name: Assert the pinned CLI version is published
        run: node scripts/check-workflow-drift.mjs --check-pin

      - name: Compare every org repo's cache.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-workflow-drift.mjs

      # R3-897 — the keep-set test: drives zip-cache.yml's consumer-pin scan (the
      # fenced inline block, extracted from the workflow itself) against a fake
      # gh, over the frozen eviction-case listing (CI has no sibling checkouts).
      - name: Self-test the kept-zip-refs keep-set (R3-897)
        run: node scripts/check-kept-zip-refs.mjs --self-test
